<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Civix AI</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#14181f;--mute:#667085;--line:#e4e7ec;--acc:#1d4ed8;
        --urgent:#b42318;--urgentbg:#fef3f2;--normal:#b54708;--normalbg:#fffaeb;--low:#067647;--lowbg:#ecfdf3}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
  main{max-width:820px;margin:0 auto;padding:28px 16px 60px}
  h1{margin:0;font-size:24px} .sub{color:var(--mute);margin:2px 0 20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  textarea,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}
  textarea{min-height:90px;resize:vertical} label{font-weight:600;font-size:13px;display:block;margin:10px 0 4px}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait} .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .chip{background:#eef2ff;color:var(--acc);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;border:0;font-weight:500}
  .badge{display:inline-block;padding:4px 12px;border-radius:99px;font-weight:700;font-size:13px}
  .URGENT{background:var(--urgentbg);color:var(--urgent)} .NORMAL{background:var(--normalbg);color:var(--normal)}
  .LOW_PRIORITY{background:var(--lowbg);color:var(--low)}
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap} .bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:3px 0}
  .bar>i{display:block;height:100%;background:var(--acc)} .prob{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:13px}
  .warn{background:#fffaeb;border:1px solid #fedf89;border-radius:8px;padding:10px;margin-top:12px;font-size:13px}
  .meta{color:var(--mute);font-size:12px;margin-top:8px} h3{margin:0 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
  pre{white-space:pre-wrap;background:#f9fafb;border:1px solid var(--line);border-radius:8px;padding:12px;margin:0;font:13px/1.5 ui-monospace,monospace}
  ol{margin:0;padding-left:20px} .hide{display:none}
</style>
</head>
<body>
<main>
  <h1>Civix AI</h1>
  <p class="sub">Smart civic issue agent &middot; Strands Decider 2B decides, Amazon Bedrock explains.</p>

  <div class="card">
    <label for="c">Describe the issue</label>
    <textarea id="c" placeholder="e.g. There is a large pothole near my college gate, and two bikes nearly fell today."></textarea>
    <label for="l">Location (optional)</label>
    <input id="l" placeholder="e.g. Avinashi Road, near PSG College gate">
    <div class="chips" id="chips"></div>
    <p><button id="go">Triage report</button></p>
  </div>

  <div id="out" class="hide">
    <div class="card">
      <h3>Decision</h3>
      <div class="row"><span id="cat" class="badge"></span><span id="conf"></span></div>
      <div id="probs" style="margin-top:10px"></div>
      <div id="review" class="warn hide"></div>
      <div class="meta" id="dmeta"></div>
    </div>
    <div class="card"><h3>Why</h3><div id="why"></div><div class="meta" id="dept"></div></div>
    <div class="card"><h3>Recommended next steps</h3><ol id="steps"></ol></div>
    <div class="card"><h3>Draft message to department</h3><pre id="draft"></pre>
      <p><button id="copy" style="background:#344054">Copy draft</button></p>
      <div class="meta" id="gmeta"></div></div>
    <p class="meta" id="disc"></p>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const samples=["There is a large pothole near my college gate, and two bikes nearly fell today.",
 "Streetlight on 3rd Cross has been off for a week, the lane is very dark at night.",
 "Garbage bin at the market corner is overflowing and smells bad.",
 "A live electric wire is hanging low near the bus stop after the rain.",
 "The paint on the pedestrian crossing is a bit faded."];
samples.forEach(s=>{const b=document.createElement('button');b.className='chip';b.textContent=s.slice(0,34)+'…';
  b.onclick=()=>$('c').value=s;$('chips').appendChild(b)});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('go').onclick=async()=>{
  const complaint=$('c').value.trim(); if(complaint.length<5) return;
  $('go').disabled=true; $('go').textContent='Analysing…';
  try{
    const r=await fetch('/api/triage',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({complaint,location:$('l').value})});
    if(!r.ok) throw new Error('Server error '+r.status);
    const d=await r.json(), dec=d.decision, p=d.plan;
    $('cat').textContent=dec.category; $('cat').className='badge '+dec.category;
    $('conf').textContent=dec.confidence==null?'Model confidence: n/a (fallback mode)':`Model confidence: ${(dec.confidence*100).toFixed(1)}%`;
    $('probs').innerHTML=Object.entries(dec.probabilities||{}).map(([k,v])=>
      `<div class="prob"><span>${esc(k)}</span><div class="bar"><i style="width:${v*100}%"></i></div><span>${(v*100).toFixed(0)}%</span></div>`).join('');
    $('review').classList.toggle('hide',!dec.needs_human_review);
    $('review').innerHTML='<b>Human review required.</b> '+dec.review_reasons.map(esc).join(' ');
    $('dmeta').textContent=`${dec.source} · ${dec.latency_ms} ms · confidence reflects the model's certainty, not guaranteed correctness`;
    $('why').textContent=p.explanation; $('dept').textContent='Suggested department: '+p.department;
    $('steps').innerHTML=(p.next_steps||[]).map(s=>`<li>${esc(s)}</li>`).join('');
    $('draft').textContent=p.draft_message; $('gmeta').textContent='Generated by: '+p.source;
    $('disc').textContent=d.disclaimer; $('out').classList.remove('hide');
  }catch(e){alert(e.message)}
  $('go').disabled=false; $('go').textContent='Triage report';
};
$('copy').onclick=()=>navigator.clipboard.writeText($('draft').textContent);
</script>
</body>
</html>
